<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor 3Pod</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080d; --bg2: #0d0f17; --bg3: #12151f; --bg4: #0a0c14;
    --border: rgba(255,255,255,0.06);
    --accent: #00e5ff; --accent2: #ff3d6b; --accent3: #b8ff57;
    --text: #e8eaf0; --muted: #4a5068; --muted2: #2a2d3e;
    --agresivo: #ff3d6b; --emocional: #c084fc; --logico: #00e5ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; z-index: 0; }

  /* Layout */
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 280px; background: var(--bg4); border-right: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 10; overflow: hidden; transition: transform 0.3s; }
  .main { flex: 1; margin-left: 280px; position: relative; z-index: 1; }
  @media (max-width: 900px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main { margin-left: 0; } }

  /* Sidebar */
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
  .sidebar-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--accent); letter-spacing: 0.1em; }
  .sidebar-logo span { color: var(--muted); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; display: block; letter-spacing: 0.15em; }
  .sidebar-stats { padding: 16px 20px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-item { background: var(--bg2); border-radius: 8px; padding: 10px; }
  .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--accent3); letter-spacing: 0.05em; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--muted); letter-spacing: 0.1em; margin-top: 2px; }
  .sidebar-section-title { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; padding: 14px 20px 8px; }
  .history-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .history-list::-webkit-scrollbar { width: 3px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 2px; }
  .history-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
  .history-item:hover { border-color: rgba(0,229,255,0.2); background: var(--bg3); }
  .history-item.active { border-color: var(--accent); background: rgba(0,229,255,0.05); }
  .history-item-product { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .history-item-meta { display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted); }
  .cache-badge { background: rgba(184,255,87,0.1); color: var(--accent3); border: 1px solid rgba(184,255,87,0.2); border-radius: 4px; padding: 1px 5px; font-size: 0.55rem; }
  .history-empty { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); text-align: center; padding: 20px; }
  .sidebar-actions { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .btn-sidebar { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; letter-spacing: 0.05em; }
  .btn-sidebar:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

  /* Main content */
  .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .menu-btn { display: none; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); padding: 6px 10px; cursor: pointer; font-size: 1rem; }
  @media (max-width: 900px) { .menu-btn { display: block; } }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.1em; color: var(--accent); text-shadow: 0 0 24px rgba(0,229,255,0.3); }
  .logo span { color: var(--text); }
  .status-dot { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: all 0.3s; }
  .dot.connected { background: var(--accent3); box-shadow: 0 0 8px var(--accent3); animation: pulse 2s infinite; }
  .dot.error { background: var(--agresivo); box-shadow: 0 0 8px var(--agresivo); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Input panel */
  .input-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
  .panel-title { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 16px; }
  .fields { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 700px) { .fields { grid-template-columns: 1fr; } }
  .field label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 6px; }
  .field input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; outline: none; transition: border-color 0.2s; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,0.06); }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn { font-family: 'Bebas Neue', sans-serif; font-size: 0.95rem; letter-spacing: 0.1em; padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { background: #33eaff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,229,255,0.25); }
  .btn-primary:disabled { background: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-danger { background: transparent; color: var(--agresivo); border: 1px solid var(--agresivo); }
  .btn-danger:hover { background: rgba(255,61,107,0.08); transform: translateY(-1px); }
  .btn-danger:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .btn-export { background: transparent; color: var(--accent3); border: 1px solid rgba(184,255,87,0.3); font-size: 0.75rem; padding: 10px 16px; }
  .btn-export:hover { background: rgba(184,255,87,0.06); }
  .btn-export:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Log */
  .log { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; min-height: 70px; display: none; }
  .log.visible { display: block; }
  .log-line { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--muted); padding: 3px 0; display: flex; align-items: center; gap: 10px; animation: fadeIn 0.3s ease; }
  .log-line.active { color: var(--accent); }
  .log-line.done { color: var(--accent3); }
  .log-line.error { color: var(--agresivo); }
  .log-icon { font-size: 0.75rem; width: 12px; flex-shrink: 0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }

  /* Results */
  .results { display: none; }
  .results.visible { display: block; animation: fadeIn 0.4s ease; }
  .product-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
  .product-info { flex: 1; }
  .product-name { font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem; line-height: 1; color: var(--text); letter-spacing: 0.05em; margin-bottom: 8px; }
  .product-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.08em; }
  .badge-cache { background: rgba(184,255,87,0.1); color: var(--accent3); border: 1px solid rgba(184,255,87,0.25); }
  .badge-fresh { background: rgba(0,229,255,0.08); color: var(--accent); border: 1px solid rgba(0,229,255,0.2); }
  .precio-badge { background: var(--bg2); border: 1px solid var(--accent3); border-radius: 10px; padding: 12px 18px; text-align: center; flex-shrink: 0; }
  .precio-label { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; display: block; margin-bottom: 2px; }
  .precio-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; color: var(--accent3); letter-spacing: 0.05em; }

  /* Angles */
  .angles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  @media (max-width: 800px) { .angles-grid { grid-template-columns: 1fr; } }
  .angle-column { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color 0.2s; }
  .angle-column:hover { border-color: rgba(255,255,255,0.1); }
  .angle-header { padding: 12px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  .angle-title { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.12em; flex: 1; }
  .angle-column.agresivo { border-top: 2px solid var(--agresivo); }
  .angle-column.emocional { border-top: 2px solid var(--emocional); }
  .angle-column.logico { border-top: 2px solid var(--logico); }
  .angle-column.agresivo .angle-title { color: var(--agresivo); }
  .angle-column.emocional .angle-title { color: var(--emocional); }
  .angle-column.logico .angle-title { color: var(--logico); }
  .btn-regenerar { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; padding: 4px 8px; border-radius: 5px; border: none; cursor: pointer; transition: all 0.2s; background: transparent; letter-spacing: 0.05em; flex-shrink: 0; }
  .angle-column.agresivo .btn-regenerar { color: var(--agresivo); border: 1px solid rgba(255,61,107,0.3); }
  .angle-column.emocional .btn-regenerar { color: var(--emocional); border: 1px solid rgba(192,132,252,0.3); }
  .angle-column.logico .btn-regenerar { color: var(--logico); border: 1px solid rgba(0,229,255,0.3); }
  .btn-regenerar:hover { opacity: 0.8; }
  .btn-regenerar:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-stop-regen { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; padding: 4px 8px; border-radius: 5px; cursor: pointer; transition: all 0.2s; background: transparent; letter-spacing: 0.05em; display: none; border: 1px solid rgba(255,61,107,0.4); color: var(--agresivo); flex-shrink: 0; }
  .btn-stop-regen:hover { background: rgba(255,61,107,0.08); }
  .angle-cards { padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
  .angle-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.82rem; line-height: 1.55; color: var(--text); cursor: pointer; transition: all 0.2s; position: relative; }
  .angle-card:hover { border-color: rgba(255,255,255,0.12); transform: translateY(-1px); background: var(--bg2); }
  .copy-hint { position: absolute; top: 7px; right: 9px; font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--muted); opacity: 0; transition: opacity 0.2s; }
  .angle-card:hover .copy-hint { opacity: 1; }
  .typing { border-right: 2px solid var(--accent); animation: blink 0.7s infinite; }
  @keyframes blink { 0%, 100% { border-color: var(--accent); } 50% { border-color: transparent; } }
  .version-nav { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); }
  .version-label { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted); flex: 1; }
  .btn-version { background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 2px 7px; cursor: pointer; transition: all 0.2s; }
  .btn-version:hover:not(:disabled) { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .btn-version:disabled { opacity: 0.2; cursor: not-allowed; }

  /* Bottom grid */
  .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .bottom-grid { grid-template-columns: 1fr; } }
  .info-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .info-panel-title { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
  .benefit-item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; line-height: 1.5; }
  .benefit-item:last-child { border-bottom: none; }
  .benefit-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent3); flex-shrink: 0; margin-top: 8px; }
  .images-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .img-card { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--bg3); border: 1px solid var(--border); }
  .img-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
  .img-card:hover img { transform: scale(1.06); }
  .no-images { grid-column: 1 / -1; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); text-align: center; padding: 20px 0; }

  /* Toast */
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg3); border: 1px solid var(--accent3); border-radius: 8px; padding: 10px 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--accent3); opacity: 0; transform: translateY(8px); transition: all 0.3s; z-index: 200; }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* Spinner */
  .spinner { width: 13px; height: 13px; border: 2px solid rgba(0,0,0,0.3); border-top-color: var(--bg); border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
  .btn-primary.loading .spinner { display: block; }
  .btn-primary.loading .btn-text { opacity: 0.7; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mobile overlay */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9; }
  .overlay.show { display: block; }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        3POD
        <span>// MOTOR DE LANDINGS</span>
      </div>
    </div>
    <div class="sidebar-stats">
      <div class="stat-item">
        <div class="stat-value" id="stat-generaciones">0</div>
        <div class="stat-label">GENERACIONES</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="stat-cache">0</div>
        <div class="stat-label">CACHE HITS</div>
      </div>
    </div>
    <div class="sidebar-section-title">// historial</div>
    <div class="history-list" id="history-list">
      <div class="history-empty">Sin generaciones aún</div>
    </div>
    <div class="sidebar-actions">
      <button class="btn-sidebar" onclick="clearHistory()">LIMPIAR</button>
      <button class="btn-sidebar" onclick="exportAll()">EXPORTAR TODO</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="container">

      <header class="header">
        <div class="header-left">
          <button class="menu-btn" onclick="toggleSidebar()">☰</button>
          <div class="logo">MOTOR <span>3POD</span></div>
        </div>
        <div class="status-dot">
          <div class="dot" id="dot"></div>
          <span id="status-text">DESCONECTADO</span>
        </div>
      </header>

      <div class="input-panel">
        <div class="panel-title">// configuración de entrada</div>
        <div class="fields">
          <div class="field">
            <label>THREAD_ID</label>
            <input type="text" id="thread_id" value="session-1">
          </div>
          <div class="field">
            <label>URL_REFERENCIA</label>
            <input type="text" id="url_referencia" placeholder="https://...">
          </div>
          <div class="field">
            <label>PROMPT</label>
            <input type="text" id="prompt" value="vender esto en Colombia">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="btn-generar" onclick="generar()">
            <div class="spinner"></div>
            <span class="btn-text">GENERAR</span>
          </button>
          <button class="btn btn-danger" id="btn-detener" onclick="detener()" disabled>DETENER</button>
          <button class="btn btn-export" id="btn-export" onclick="exportarResultado()" disabled>↓ EXPORTAR JSON</button>
        </div>
      </div>

      <div class="log" id="log"></div>

      <div class="results" id="results">
        <div class="product-header">
          <div class="product-info">
            <div class="product-name" id="product-name">—</div>
            <div class="product-badges" id="product-badges"></div>
          </div>
          <div class="precio-badge">
            <span class="precio-label">PRECIO VENTA</span>
            <div class="precio-value" id="precio-value">$0</div>
          </div>
        </div>

        <div class="angles-grid">
          <div class="angle-column agresivo">
            <div class="angle-header">
              <span class="angle-title">AGRESIVO</span>
              <button class="btn-regenerar" onclick="regenerar('agresivo')" id="btn-regen-agresivo">↻</button>
              <button class="btn-stop-regen" onclick="detenerRegen('agresivo')" id="btn-stop-agresivo">✕</button>
            </div>
            <div class="angle-cards" id="angles-agresivo"></div>
            <div class="version-nav">
              <span class="version-label" id="ver-agresivo">v1 / 1</span>
              <button class="btn-version" onclick="navVersion('agresivo', -1)" id="prev-agresivo" disabled>◀</button>
              <button class="btn-version" onclick="navVersion('agresivo', 1)" id="next-agresivo" disabled>▶</button>
            </div>
          </div>
          <div class="angle-column emocional">
            <div class="angle-header">
              <span class="angle-title">EMOCIONAL</span>
              <button class="btn-regenerar" onclick="regenerar('emocional')" id="btn-regen-emocional">↻</button>
              <button class="btn-stop-regen" onclick="detenerRegen('emocional')" id="btn-stop-emocional">✕</button>
            </div>
            <div class="angle-cards" id="angles-emocional"></div>
            <div class="version-nav">
              <span class="version-label" id="ver-emocional">v1 / 1</span>
              <button class="btn-version" onclick="navVersion('emocional', -1)" id="prev-emocional" disabled>◀</button>
              <button class="btn-version" onclick="navVersion('emocional', 1)" id="next-emocional" disabled>▶</button>
            </div>
          </div>
          <div class="angle-column logico">
            <div class="angle-header">
              <span class="angle-title">LÓGICO</span>
              <button class="btn-regenerar" onclick="regenerar('logico')" id="btn-regen-logico">↻</button>
              <button class="btn-stop-regen" onclick="detenerRegen('logico')" id="btn-stop-logico">✕</button>
            </div>
            <div class="angle-cards" id="angles-logico"></div>
            <div class="version-nav">
              <span class="version-label" id="ver-logico">v1 / 1</span>
              <button class="btn-version" onclick="navVersion('logico', -1)" id="prev-logico" disabled>◀</button>
              <button class="btn-version" onclick="navVersion('logico', 1)" id="next-logico" disabled>▶</button>
            </div>
          </div>
        </div>

        <div class="bottom-grid">
          <div class="info-panel">
            <div class="info-panel-title">// beneficios</div>
            <div id="beneficios"></div>
          </div>
          <div class="info-panel">
            <div class="info-panel-title">// imágenes del producto</div>
            <div class="images-grid" id="imagenes"></div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const WS_URL = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';
  let ws = null;
  const history = { agresivo: [], emocional: [], logico: [] };
  const currentVersion = { agresivo: 0, emocional: 0, logico: 0 };
  let regenHandler = null;
  let regenTipoActivo = null;
  let currentResult = null;

  // Stats
  let stats = JSON.parse(localStorage.getItem('3pod-stats') || '{"generaciones":0,"cacheHits":0}');
  let sessionHistory = JSON.parse(localStorage.getItem('3pod-history') || '[]');

  function saveStats() { localStorage.setItem('3pod-stats', JSON.stringify(stats)); }
  function saveHistory() { localStorage.setItem('3pod-history', JSON.stringify(sessionHistory.slice(-20))); }

  function updateStatsUI() {
    document.getElementById('stat-generaciones').textContent = stats.generaciones;
    document.getElementById('stat-cache').textContent = stats.cacheHits;
  }

  function renderHistory() {
    const el = document.getElementById('history-list');
    if (!sessionHistory.length) { el.innerHTML = '<div class="history-empty">Sin generaciones aún</div>'; return; }
    el.innerHTML = sessionHistory.slice().reverse().map((item, i) => {
      const realIdx = sessionHistory.length - 1 - i;
      return `
      <div class="history-item ${i === 0 ? 'active' : ''}">
        <div class="history-item-product" onclick="loadFromHistory(${realIdx})">${item.producto}</div>
        <div class="history-item-meta">
          <span onclick="loadFromHistory(${realIdx})" style="cursor:pointer">$${item.precio_calculado}</span>
          ${item.from_cache ? '<span class="cache-badge">CACHE</span>' : '<span style="color:var(--accent);font-size:0.55rem">FRESH</span>'}
          <span style="margin-left:auto">${new Date(item.ts).toLocaleTimeString()}</span>
          <span onclick="deleteHistoryItem(${realIdx})" style="cursor:pointer;color:var(--agresivo);padding-left:6px">✕</span>
        </div>
      </div>`;
    }).join('');
  }

  function loadFromHistory(idx) {
    const item = sessionHistory[idx];
    if (!item) return;
    currentResult = item;
    document.getElementById('product-name').textContent = item.producto || '-';
    document.getElementById('precio-value').textContent = '$' + item.precio_calculado;
    const badgesEl = document.getElementById('product-badges');
    badgesEl.innerHTML = item.from_cache
      ? '<span class="badge badge-cache">⚡ DESDE CACHE</span>'
      : '<span class="badge badge-fresh">🔍 SCRAPING FRESCO</span>';
    ['agresivo', 'emocional', 'logico'].forEach(tipo => {
      const frases = (item.angulos && item.angulos[tipo]) ? item.angulos[tipo] : [];
      history[tipo] = [[...frases]];
      currentVersion[tipo] = 0;
      renderAngulos(tipo, frases, false);
      updateVersionNav(tipo);
    });
    const benEl = document.getElementById('beneficios');
    benEl.innerHTML = '';
    (item.beneficios || []).forEach(b => {
      benEl.innerHTML += '<div class="benefit-item"><div class="benefit-dot"></div><span>' + b + '</span></div>';
    });
    const imgEl = document.getElementById('imagenes');
    imgEl.innerHTML = '';
    const imgs = (item.imagenes || []).filter(Boolean);
    if (!imgs.length) { imgEl.innerHTML = '<div class="no-images">Sin imagenes disponibles</div>'; }
    else { imgs.forEach(src => { imgEl.innerHTML += '<div class="img-card"><img src="' + src + '" alt="producto" onerror="this.parentElement.style.display=\'none\'"></div>'; }); }
    document.getElementById('results').classList.add('visible');
    document.getElementById('btn-export').disabled = false;
    showToast('Historial cargado: ' + item.producto);
  }
  function deleteHistoryItem(idx) {
    sessionHistory.splice(idx, 1);
    saveHistory();
    renderHistory();
    showToast('Eliminado del historial');
  }

  function clearHistory() {
    if (!confirm('¿Limpiar historial y resetear estadísticas?')) return;
    sessionHistory = [];
    stats = { generaciones: 0, cacheHits: 0 };
    saveHistory();
    saveStats();
    updateStatsUI();
    renderHistory();
    showToast('Historial limpiado');
  }

  function exportAll() {
    const blob = new Blob([JSON.stringify(sessionHistory, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '3pod-historial-' + Date.now() + '.json';
    a.click();
    showToast('Historial exportado');
  }

  // Sidebar
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }

  // WebSocket
  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => setStatus('connected', 'CONECTADO');
    ws.onclose = () => { setStatus('', 'DESCONECTADO'); setTimeout(connect, 3000); };
    ws.onerror = () => setStatus('error', 'ERROR');
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (regenHandler) { regenHandler(msg); return; }
      if (msg.event === 'status') addLog(msg.data.mensaje, msg.data.nodo ? 'active' : '');
      if (msg.event === 'resultado') {
        renderResultado(msg.data, true);
        setGenerating(false);
        addLog('Generacion completada.', 'done');
      }
      if (msg.event === 'fin') setGenerating(false);
      if (msg.event === 'error') { addLog('Error: ' + msg.data.mensaje, 'error'); setGenerating(false); }
    };
  }

  function generar() {
    if (!ws || ws.readyState !== WebSocket.OPEN) { showToast('Sin conexion WebSocket'); return; }
    const thread_id = document.getElementById('thread_id').value || 'session-1';
    const prompt = document.getElementById('prompt').value || 'vender esto en Colombia';
    const url_referencia = document.getElementById('url_referencia').value;
    clearLog();
    document.getElementById('results').classList.remove('visible');
    setGenerating(true);
    addLog('Iniciando motor 3Pod...');
    const payload = { action: 'generar', thread_id, prompt };
    if (url_referencia) payload.url_referencia = url_referencia;
    ws.send(JSON.stringify(payload));
  }

  function detener() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ action: 'detener' }));
    setGenerating(false);
    addLog('Proceso detenido.', 'error');
  }

  function regenerar(tipo) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    regenTipoActivo = tipo;
    document.getElementById('btn-regen-' + tipo).disabled = true;
    document.getElementById('btn-stop-' + tipo).style.display = 'inline-flex';
    addLog('Regenerando angulos ' + tipo + '...', 'active');
    const prompt = document.getElementById('prompt').value;
    const url_referencia = document.getElementById('url_referencia').value;
    const payload = { action: 'generar', thread_id: 'regen-' + tipo + '-' + Date.now(), prompt: prompt + ' enfoque ' + tipo };
    if (url_referencia) payload.url_referencia = url_referencia;
    ws.send(JSON.stringify(payload));
    regenHandler = (msg) => {
      if (msg.event === 'resultado' && msg.data.angulos) {
        history[tipo].push([...msg.data.angulos[tipo]]);
        currentVersion[tipo] = history[tipo].length - 1;
        renderAngulos(tipo, history[tipo][currentVersion[tipo]], true);
        updateVersionNav(tipo);
        document.getElementById('btn-regen-' + tipo).disabled = false;
        document.getElementById('btn-stop-' + tipo).style.display = 'none';
        addLog('Angulos ' + tipo + ' regenerados.', 'done');
        regenHandler = null;
        regenTipoActivo = null;
      }
    };
  }

  function detenerRegen(tipo) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ action: 'detener' }));
    document.getElementById('btn-regen-' + tipo).disabled = false;
    document.getElementById('btn-stop-' + tipo).style.display = 'none';
    regenHandler = null;
    regenTipoActivo = null;
    addLog('Regeneracion de ' + tipo + ' detenida.', 'error');
  }

  function navVersion(tipo, dir) {
    const newIdx = currentVersion[tipo] + dir;
    if (newIdx < 0 || newIdx >= history[tipo].length) return;
    currentVersion[tipo] = newIdx;
    renderAngulos(tipo, history[tipo][currentVersion[tipo]], false);
    updateVersionNav(tipo);
  }

  function renderResultado(data, animate) {
    currentResult = { ...data, ts: Date.now() };
    document.getElementById('product-name').textContent = data.producto || '-';
    document.getElementById('precio-value').textContent = '$' + data.precio_calculado;

    // Badges
    const badgesEl = document.getElementById('product-badges');
    badgesEl.innerHTML = data.from_cache
      ? '<span class="badge badge-cache">⚡ DESDE CACHE</span>'
      : '<span class="badge badge-fresh">🔍 SCRAPING FRESCO</span>';

    // Stats
    stats.generaciones++;
    if (data.from_cache) stats.cacheHits++;
    saveStats();
    updateStatsUI();

    // History
    sessionHistory.push(currentResult);
    saveHistory();
    renderHistory();

    ['agresivo', 'emocional', 'logico'].forEach(tipo => {
      const frases = (data.angulos && data.angulos[tipo]) ? data.angulos[tipo] : [];
      history[tipo] = [[...frases]];
      currentVersion[tipo] = 0;
      renderAngulos(tipo, frases, animate);
      updateVersionNav(tipo);
    });

    const benEl = document.getElementById('beneficios');
    benEl.innerHTML = '';
    (data.beneficios || []).forEach(b => {
      benEl.innerHTML += '<div class="benefit-item"><div class="benefit-dot"></div><span>' + b + '</span></div>';
    });

    const imgEl = document.getElementById('imagenes');
    imgEl.innerHTML = '';
    const imgs = (data.imagenes || []).filter(Boolean);
    if (!imgs.length) { imgEl.innerHTML = '<div class="no-images">Sin imagenes disponibles</div>'; }
    else { imgs.forEach(src => { imgEl.innerHTML += '<div class="img-card"><img src="' + src + '" alt="producto" onerror="this.parentElement.style.display=\'none\'"></div>'; }); }

    document.getElementById('results').classList.add('visible');
    document.getElementById('btn-export').disabled = false;
  }

  function renderAngulos(tipo, frases, animate) {
    const el = document.getElementById('angles-' + tipo);
    el.innerHTML = '';
    frases.forEach((frase, i) => {
      const card = document.createElement('div');
      card.className = 'angle-card';
      card.innerHTML = '<span class="frase-text"></span><span class="copy-hint">COPIAR</span>';
      card.onclick = () => copiar(frase);
      el.appendChild(card);
      const span = card.querySelector('.frase-text');
      if (animate) {
        typeText(span, frase, i * 150);
      } else {
        span.textContent = frase;
      }
    });
  }

  function typeText(el, text, delay) {
    setTimeout(() => {
      let i = 0;
      el.classList.add('typing');
      const interval = setInterval(() => {
        el.textContent = text.slice(0, ++i);
        if (i >= text.length) { clearInterval(interval); el.classList.remove('typing'); }
      }, 18);
    }, delay);
  }

  function updateVersionNav(tipo) {
    const total = history[tipo].length;
    const cur = currentVersion[tipo];
    document.getElementById('ver-' + tipo).textContent = 'v' + (cur + 1) + ' / ' + total;
    document.getElementById('prev-' + tipo).disabled = cur <= 0;
    document.getElementById('next-' + tipo).disabled = cur >= total - 1;
  }

  function exportarResultado() {
    if (!currentResult) return;
    const blob = new Blob([JSON.stringify(currentResult, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '3pod-' + (currentResult.producto || 'resultado').replace(/\s+/g, '-').toLowerCase() + '.json';
    a.click();
    showToast('JSON exportado');
  }

  function setStatus(cls, text) {
    document.getElementById('dot').className = 'dot ' + cls;
    document.getElementById('status-text').textContent = text;
  }

  function setGenerating(val) {
    const btn = document.getElementById('btn-generar');
    btn.disabled = val;
    btn.classList.toggle('loading', val);
    document.getElementById('btn-detener').disabled = !val;
  }

  function addLog(msg, cls) {
    cls = cls || '';
    const log = document.getElementById('log');
    log.classList.add('visible');
    const icons = { active: '▶', done: '✓', error: '✕', '': '·' };
    log.innerHTML += '<div class="log-line ' + cls + '"><span class="log-icon">' + (icons[cls] || '·') + '</span>' + msg + '</div>';
    log.scrollTop = log.scrollHeight;
  }

  function clearLog() {
    const log = document.getElementById('log');
    log.innerHTML = '';
    log.classList.remove('visible');
    Object.keys(history).forEach(k => { history[k] = []; currentVersion[k] = 0; });
  }

  function copiar(texto) {
    navigator.clipboard.writeText(texto).then(() => showToast('Copiado'));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Init
  updateStatsUI();
  renderHistory();
  connect();
</script>
</body>
</html>
